name: Vercel Production Deployment

on:
  workflow_run:
    workflows: ["CI — Build, Typecheck, and Security"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via Vercel CLI when token is configured
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel if VERCEL_TOKEN is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_al3IoF3MWxQipmb4XZmiIUN4
          VERCEL_PROJECT_ID: prj_iGdvwgYqCUXWy5yanSry0A8UcAsc
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured. Vercel Git Integration handles automatic production deployments from main."
            exit 0
          fi
          npm install --global vercel@latest
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
