name: Max Router - Deteksi Error

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-backend:
    name: Audit Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        working-directory: .
        run: npm install --no-audit --no-fund --workspaces

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck backend
        run: npm run typecheck

      - name: Syntax audit for JavaScript
        run: |
          set -e
          # ThemeProvider.js contains JSX and is compiled by the frontend toolchain,
          # so Node's plain-JavaScript parser must not be run against that file.
          find src -type f -name '*.js' ! -path 'src/shared/components/ThemeProvider.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Build backend
        run: npm run build

      - name: Verify route inventory
        run: |
          test -d dist/routes
          COUNT=$(find dist/routes -type f -name 'route.js' | wc -l)
          echo "Route modules found: $COUNT"
          test "$COUNT" -gt 0

      - name: Verify diagnostics and database guard
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const required = [
            'src/routes/diagnostics/route.ts',
            'src/lib/oauth/providers.js',
            'src/lib/oauth/utils/server.js'
          ];

          for (const file of required) {
            if (!fs.existsSync(file)) throw new Error('File wajib tidak ditemukan: ' + file);
            console.log('OK:', file);
          }

          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = dir + '/' + entry.name;
              if (entry.isDirectory()) walk(full);
              else if (/\.(js|ts|mjs|tsx)$/.test(entry.name)) files.push(full);
            }
          }
          walk('src');

          const source = files.map(f => fs.readFileSync(f, 'utf8')).join('\n');

          const checks = [
            ['Diagnostics endpoint', '/api/diagnostics'],
            ['Health endpoint', '/api/health'],
            ['Provider API', '/api/providers'],
            ['PostgreSQL support', 'createPostgresAdapter'],
            ['DATABASE_URL', 'DATABASE_URL'],
            ['Ephemeral SQLite guard', 'ALLOW_EPHEMERAL_SQLITE']
          ];

          for (const [label, needle] of checks) {
            if (!source.includes(needle)) throw new Error('Audit gagal: ' + label);
            console.log('OK:', label);
          }

          if (/antigravity/i.test(source)) {
            console.warn('WARNING: ditemukan referensi Antigravity di source; periksa sebelum rilis.');
          }

          if (/v1internal:models/.test(source)) {
            throw new Error('Legacy v1internal:models masih ditemukan.');
          }

          console.log('Static runtime/database/diagnostics audit: OK');
          NODE


      - name: Audit OAuth email dan sesi Max Router
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const checks = [
            ['Email accounts handler', 'src/routes/email/accounts/route.ts', 'GET_handler'],
            ['Gmail OAuth start', 'src/routes/email/oauth/gmail/start/route.ts', 'GOOGLE_CLIENT_ID'],
            ['Gmail OAuth callback', 'src/routes/email/oauth/gmail/callback/route.ts', 'setDashboardAuthCookie'],
            ['Session cookie', 'src/lib/auth/dashboardSession.js', '9r_session'],
            ['Secure cookie detection', 'src/lib/auth/dashboardSession.js', 'x-forwarded-proto'],
            ['SameSite protection', 'src/lib/auth/dashboardSession.js', 'sameSite'],
            ['Auth middleware session check', 'src/middleware/auth.ts', 'verifyDashboardAuthToken'],
          ];

          for (const [label, file, needle] of checks) {
            if (!fs.existsSync(file)) throw new Error('[EMAIL-AUTH] File tidak ditemukan: ' + file);
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(needle)) {
              throw new Error('[EMAIL-AUTH] ' + label + ' gagal: "' + needle + '" tidak ditemukan di ' + file);
            }
            console.log('[EMAIL-AUTH] OK: ' + label);
          }

          const callback = fs.readFileSync('src/routes/email/oauth/gmail/callback/route.ts', 'utf8');
          if (!callback.includes('req.cookies?.["9r_session"]')) {
            throw new Error('[EMAIL-AUTH] Callback Gmail tidak membaca sesi 9r_session.');
          }
          if (!callback.includes('verifyDashboardAuthToken(existingSession)')) {
            throw new Error('[EMAIL-AUTH] Callback Gmail tidak memvalidasi sesi dashboard.');
          }

          const session = fs.readFileSync('src/lib/auth/dashboardSession.js', 'utf8');
          if (!/httpOnly:\s*true/.test(session)) throw new Error('[EMAIL-AUTH] Cookie sesi harus httpOnly.');
          if (!/sameSite:\s*"lax"/.test(session)) throw new Error('[EMAIL-AUTH] Cookie sesi harus SameSite=Lax.');

          console.log('[EMAIL-AUTH] Static OAuth/session audit: PASS');
          NODE

      - name: Smoke test endpoint auth tanpa membocorkan secret
        env:
          NODE_ENV: test
          PORT: 20223
          ALLOW_EPHEMERAL_SQLITE: 'true'
          INITIAL_PASSWORD: 'ci-test-password-not-production'
          JWT_SECRET: 'ci-only-secret-not-production'
        run: |
          timeout 30s npm start > /tmp/max-router-auth.log 2>&1 &
          PID=$!
          sleep 8

          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/max-router-auth.log
            exit 1
          fi

          node --input-type=module - <<'NODE'
          const base = 'http://127.0.0.1:20223';

          const login = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({password: 'ci-test-password-not-production'})
          });

          const setCookie = login.headers.get('set-cookie') || '';
          console.log('[AUTH-SMOKE] login HTTP:', login.status);
          console.log('[AUTH-SMOKE] cookie present:', Boolean(setCookie));
          console.log('[AUTH-SMOKE] cookie flags:', setCookie.replace(/9r_session=[^;]+/g, '9r_session=<redacted>'));

          if (!login.ok) throw new Error('[AUTH-SMOKE] Login test gagal.');
          if (!/9r_session=/.test(setCookie)) throw new Error('[AUTH-SMOKE] Cookie 9r_session tidak diterbitkan.');

          const token = setCookie.match(/9r_session=([^;]+)/)?.[1];
          const accounts = await fetch(base + '/api/email/accounts', {
            headers: {cookie: '9r_session=' + token}
          });
          console.log('[AUTH-SMOKE] /api/email/accounts HTTP:', accounts.status);
          const body = await accounts.text();
          console.log('[AUTH-SMOKE] accounts response:', body.slice(0, 500));

          if (accounts.status === 401) {
            throw new Error('[AUTH-SMOKE] SESI PUTUS: /api/email/accounts mengembalikan 401 setelah login.');
          }
          if (!accounts.ok) throw new Error('[AUTH-SMOKE] /api/email/accounts gagal HTTP ' + accounts.status);
          NODE

          cat /tmp/max-router-auth.log
          kill "$PID" || true

      - name: Validate workflow YAML
        working-directory: .
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = '.github/workflows/max-router-error-detection.yml';
          const text = fs.readFileSync(file, 'utf8');
          if (!text.includes('jobs:')) throw new Error('Workflow YAML tidak memiliki jobs');
          if (!text.includes('Email accounts handler')) throw new Error('Workflow belum memuat pemeriksaan rute email');
          if (!text.includes('Static runtime/database/diagnostics audit: OK')) throw new Error('Pesan hasil audit runtime/database tidak ditemukan');
          console.log('Workflow consistency audit: OK');
          NODE

      - name: Start smoke test
        env:
          NODE_ENV: test
          PORT: 20222
          ALLOW_EPHEMERAL_SQLITE: 'true'
        run: |
          timeout 30s npm start > /tmp/max-router-start.log 2>&1 &
          PID=$!
          sleep 8

          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/max-router-start.log
            exit 1
          fi

          node --input-type=module - <<'NODE'
          const health = await fetch('http://127.0.0.1:20222/api/health');
          const healthText = await health.text();
          console.log('HEALTH:', healthText);
          if (!health.ok) throw new Error('Health endpoint gagal: HTTP ' + health.status);

          const diagnostics = await fetch('http://127.0.0.1:20222/api/diagnostics');
          const diagnosticsText = await diagnostics.text();
          console.log('DIAGNOSTICS:', diagnosticsText);
          if (!diagnostics.ok) throw new Error('Diagnostics endpoint gagal: HTTP ' + diagnostics.status);
          NODE

          cat /tmp/max-router-start.log
          kill "$PID" || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: max-router-error-log
          path: |
            /tmp/max-router-start.log
            /tmp/route-import-errors.log
          if-no-files-found: ignore

  audit-frontend:
    name: Audit Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build
